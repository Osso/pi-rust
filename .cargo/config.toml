# Reuse workspace compilation state for fast edit/check/build/test loops.
# Integration-test consolidation bounds the number of incremental caches.
[build]
incremental = true

[alias]
# `cargo pi -- <args>` runs the coding-agent CLI.
pi = "run -p pi-coding-agent --bin pi --"

# Test binaries get private state plus mandatory helper/network isolation.
# Requires Linux bubblewrap; see README.md#test-process-isolation.
[target.'cfg(all())']
runner = "scripts/cargo-runner.sh"
