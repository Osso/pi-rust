# Overrides the user-level `build.incremental = true`: incremental state for
# ~460 test binaries is the largest part of target/.
[build]
incremental = false

[alias]
# `cargo pi -- <args>` runs the coding-agent CLI.
pi = "run -p pi-coding-agent --bin pi --"

# Test binaries get a private Pi state directory (see the script header).
[target.'cfg(all())']
runner = "scripts/cargo-runner.sh"
