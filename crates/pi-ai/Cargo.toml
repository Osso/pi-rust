[package]
autotests = false
name = "pi-ai"
version = "0.0.0"
description = "Rust port of Pi's LLM provider abstraction"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Shared JavaScript number/date/Base64 semantics.
pi-js-compat = { version = "=0.0.0", path = "../pi-js-compat" }
futures-util = { version = "=0.3.34", features = ["sink"] }
getrandom = "=0.4.3"
hmac = "=0.12.1"
httpdate = "=1.0.3"
indexmap = { version = "=2.14.2", features = ["serde"] }
# Frozen idn-hostname format normalizes valid Unicode runs to NFC.
icu_normalizer = "=2.3.0"
regex = "=1.13.1"
# ECMAScript patterns over UTF-16 code units, including backreferences.
regress = { version = "=0.12.0", features = ["utf16"] }
reqwest = "=0.13.5"
rsa = { version = "=0.9.10", features = ["pem", "sha2"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }
sha1 = "=0.10.6"
sha2 = "=0.10.9"
tokio = { version = "=1.53.3", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
url = "=2.5.8"
zstd = "=0.14.3"

[dev-dependencies]
# Process-group teardown for tsx oracle children in tests.
rustix = { version = "=1.1.5", features = ["process"] }
tokio = { version = "=1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true

[[test]]
name = "suite_core_1"
path = "tests/suite_core_1.rs"

[[test]]
name = "suite_core_2"
path = "tests/suite_core_2.rs"

[[test]]
name = "suite_modes"
path = "tests/suite_modes.rs"

[[test]]
name = "suite_tools"
path = "tests/suite_tools.rs"

[[test]]
name = "auth_types_contract"
path = "tests/auth_types_contract.rs"

[[test]]
name = "compat"
