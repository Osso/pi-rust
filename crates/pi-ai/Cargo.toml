[package]
name = "pi-ai"
version = "0.0.0"
description = "Rust port of Pi's LLM provider abstraction"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
getrandom = "=0.4.3"
hmac = "=0.12.1"
httpdate = "=1.0.3"
regex = "=1.13.1"
reqwest = "=0.13.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }
sha1 = "=0.10.6"

sha2 = "=0.10.9"
tokio = { version = "=1.53.3", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
url = "=2.5.8"

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
