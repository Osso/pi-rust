[package]
name = "pi-ai"
version = "0.0.0"
description = "Rust port of Pi's LLM provider abstraction"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
getrandom = "=0.4.3"
httpdate = "=1.0.3"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.3", features = ["macros", "rt", "sync", "test-util", "time"] }
tokio-util = "=0.7.20"

[lints]
workspace = true
