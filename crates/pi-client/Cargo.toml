[package]
name = "pi-client"
version = "0.0.0"
description = "Rust port of Pi's protocol client"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pi-protocol = { version = "=0.0.0", path = "../pi-protocol" }
tokio = { version = "=1.53.3", features = ["io-util", "net", "rt", "sync"] }
tokio-util = "=0.7.20"

[dev-dependencies]
serde_json = "=1.0.151"
tokio = { version = "=1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }

[lints]
workspace = true
