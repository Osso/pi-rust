[package]
name = "pi-session-sqlite"
version = "0.0.0"
description = "Rust port of Pi's SQLite session backend"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pi-agent-core = { version = "=0.0.0", path = "../pi-agent-core" }
pi-ai = { version = "=0.0.0", path = "../pi-ai" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tokio = { version = "=1.53.3", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
