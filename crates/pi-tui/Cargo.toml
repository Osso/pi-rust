[package]
name = "pi-tui"
version = "0.0.0"
description = "Rust port of Pi's terminal UI library"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Shared JS string/number/Base64 semantics.
pi-js-compat = { version = "=0.0.0", path = "../pi-js-compat" }
# Grapheme cluster segmentation matching the Unicode 17.0 tables used by Node's Intl.Segmenter.
unicode-segmentation = "=1.13.3"
# Editor paste-marker and autocomplete trigger/debounce patterns.
regex = "=1.13.1"
# Executes the lookaround/backreference grammar ported from marked 18.0.5.
fancy-regex = "=0.16.2"
# Serializes marked tokens and exact TUI debug-dump JSON payloads.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# ICU4X word segmentation: dictionary/LSTM behavior matching Intl.Segmenter.
icu_segmenter = "=2.3.0"
# Async process I/O for fd-backed file suggestions and AbortSignal cancellation.
tokio = { version = "=1.53.3", features = ["process", "rt", "sync", "io-util", "macros"] }
# Safe termios/tty access for ProcessTerminal raw mode and window size (no libc/unsafe).
rustix = { version = "=1.1.5", features = ["termios", "event"] }

[dev-dependencies]
# Creates isolated directory trees for path-completion tests.
tempfile = "=3.27.0"
# Kills oracle process groups so a failed differential leaves no tsx/node children.
rustix = { version = "=1.1.5", features = ["process"] }
tokio = { version = "=1.53.3", features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true

[[test]]
name = "terminal_stream"
harness = false
