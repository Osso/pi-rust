[package]
name = "pi-tui"
version = "0.0.0"
description = "Rust port of Pi's terminal UI library"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Grapheme cluster segmentation matching the Unicode 17.0 tables used by Node's Intl.Segmenter.
unicode-segmentation = "=1.13.3"
# Compiles the Unicode-property patterns ported verbatim from the LaTeX renderer.
regex = "=1.13.1"
# ICU4X word segmentation: dictionary/LSTM behavior matching Intl.Segmenter.
icu_segmenter = "=2.3.0"
# Async process I/O for fd-backed file suggestions and AbortSignal cancellation.
tokio = { version = "=1.53.3", features = ["process", "rt", "sync", "io-util"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }

[dev-dependencies]
# Drives JSON-lines differential requests against the pinned TypeScript source.
serde_json = "=1.0.151"
# Creates isolated directory trees for path-completion tests.
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
