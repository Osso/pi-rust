[package]
name = "pi-js-compat"
version = "0.0.0"
description = "Shared JavaScript-semantics helpers (localeCompare, Number, Date.parse, Base64, minimatch)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Abort notification and unref-like timeout tasks on the existing async runtime.
tokio = { version = "=1.53.3", features = ["sync", "time", "rt"] }
# Shared platform errno names for Node filesystem/spawn errors.
rustix = "=1.1.5"
# Lossless UTF-16 JSON keys retain first insertion slots on duplicate replacement.
indexmap = "=2.14.2"
# ECMAScript shortest binary64 decimal formatting, including even-digit ties.
ryu-js = "=1.0.3"
# Serializes JavaScript numeric values through generic serde serializers.
serde = "=1.0.229"
# `JSON.stringify(number)` value construction for extension payloads.
serde_json = { version = "=1.0.151", features = ["preserve_order", "raw_value"] }
# Local offsets and IANA TZ lookup for Date.parse and en-US date formatting.
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# `String.prototype.localeCompare` / `Intl.Collator`.
icu_collator = { version = "=2.3.1", features = ["compiled_data"] }
icu_locale_core = "=2.3.0"
# ICU4C preserves lone UTF-16 surrogates that ICU4X compare_utf16 replaces.
rust_icu_ucol = "=5.8.0"
rust_icu_ustring = "=5.8.0"
# ECMAScript regex syntax and native UTF-16/UCS-2 matching for validation and globs.
regress = { version = "=0.12.0", features = ["utf16"] }
# `node:sqlite` TEXT binding of JavaScript strings (UTF-8 with U+FFFD for unpaired surrogates).
rusqlite = { version = "=0.37.0", optional = true }

[features]
rusqlite = ["dep:rusqlite"]

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread"] }
# Exercises numeric field serialize_with attributes without changing runtime features.
serde = { version = "=1.0.229", features = ["derive"] }
# Process-group teardown for tsx oracle children in tests.
rustix = { version = "=1.1.5", features = ["process"] }
serde_json = "=1.0.151"
# Binds lossless strings through a real in-memory SQLite database.
rusqlite = { version = "=0.37.0", features = ["bundled"] }

[lints]
workspace = true
