[package]
name = "pi-js-compat"
version = "0.0.0"
description = "Shared JavaScript-semantics helpers (localeCompare, Number, Date.parse, Base64, minimatch)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Shared platform errno names for Node filesystem/spawn errors.
rustix = "=1.1.5"
# Lossless UTF-16 JSON keys retain first insertion slots on duplicate replacement.
indexmap = "=2.14.2"
# Serializes JavaScript numbers without serde_json's trailing `.0`.
serde = "=1.0.229"
# `JSON.stringify(number)` value construction for extension payloads.
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
# Resolves the system UTC offset for zone-less `Date.parse` values.
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tz-system"] }
# `String.prototype.localeCompare` / `Intl.Collator`.
icu_collator = { version = "=2.3.1", features = ["compiled_data"] }
icu_locale_core = "=2.3.0"
# ICU4C preserves lone UTF-16 surrogates that ICU4X compare_utf16 replaces.
rust_icu_ucol = "=5.8.0"
rust_icu_ustring = "=5.8.0"
# Executes minimatch's lookaround regular expressions.
fancy-regex = "=0.16.2"

[dev-dependencies]
# Process-group teardown for tsx oracle children in tests.
rustix = { version = "=1.1.5", features = ["process"] }
serde_json = "=1.0.151"
# `TimeZone::get` for the explicit-zone differential tests.
jiff = { version = "=0.2.38", default-features = false, features = [
    "std",
    "tz-system",
    "tzdb-zoneinfo",
] }

[lints]
workspace = true
