[package]
name = "pi-evals"
version = "0.0.0"
description = "Rust port of Pi's model-backed eval harness and vitest-evals adapters"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Drives a real AgentSession and reuses the ported session/services contracts.
pi-coding-agent = { version = "=0.0.0", path = "../pi-coding-agent" }
# Model/usage/message types and `contentText`, plus `crypto.randomUUID`.
pi-ai = { version = "=0.0.0", path = "../pi-ai" }
# Agent message types consumed by the transcript adapter.
pi-agent-core = { version = "=0.0.0", path = "../pi-agent-core" }
# `String.prototype.trim`, `localeCompare`, and JavaScript number serialization.
pi-js-compat = { version = "=0.0.0", path = "../pi-js-compat" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }
# Insertion-ordered grouping matching TypeScript `Map` iteration.
indexmap = { version = "=2.14.2", features = ["serde"] }
# `createHash("sha256")` for eval group keys and artifact directories.
sha2 = "=0.10.9"
# `mkdtemp(join(tmpdir(), "pi-eval-"))` for isolated eval workspaces.
tempfile = "=3.27.0"
# Extension-import scanning in the extension-authoring judge.
regex = "=1.13.1"
tokio = { version = "=1.53.3", features = ["fs", "macros", "rt", "sync", "time"] }
tokio-util = "=0.7.20"

[dev-dependencies]
rustix = { version = "=1.1.5", features = ["process"] }
tokio = { version = "=1.53.3", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
