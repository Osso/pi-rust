[package]
name = "pi-telemetry"
version = "0.0.0"
description = "Rust port of Pi's telemetry primitives"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Insertion-ordered maps: schema span/attribute keys keep TypeScript object order.
indexmap = { version = "=2.14.2", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
# Process-group teardown for tsx oracle children in tests.
rustix = { version = "=1.1.5", features = ["process"] }
futures = "=0.3.31"
serde_json = "=1.0.151"

[lints]
workspace = true
