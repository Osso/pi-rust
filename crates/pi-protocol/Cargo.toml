[package]
name = "pi-protocol"
version = "0.0.0"
description = "Rust port of Pi's transport-neutral protocol primitives"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Converts execution-boundary JSON values into `JsonValue` for protocol transcripts.
serde_json = { version = "=1.0.151", features = ["preserve_order"] }

[dev-dependencies]
# Process-group teardown for tsx oracle children in tests.
rustix = { version = "=1.1.5", features = ["process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints]
workspace = true
