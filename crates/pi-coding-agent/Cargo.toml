[package]
name = "pi-coding-agent"
version = "0.0.0"
description = "Rust port of Pi's coding-agent runtime"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Supplies typed agent-harness values and the shared truncation size formatter.
pi-agent-core = { version = "=0.0.0", path = "../pi-agent-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
regex = "=1.13.1"
gethostname = "=1.1.0"
serde_yaml_ng = "=0.10.0"
url = "=2.5.8"
percent-encoding = "=2.3.2"
tokio = { version = "=1.53.3", features = ["rt", "macros", "time", "sync", "process", "io-util"] }
tokio-util = "=0.7.20"
notify = "=8.2.0"
ureq = "=3.3.0"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
