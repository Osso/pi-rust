[package]
name = "pi-coding-agent"
version = "0.0.0"
description = "Rust port of Pi's coding-agent runtime"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
# `src/main.rs` is the ported `main.ts` library module; the executable target is
# declared explicitly as `pi`.
autobins = false
autotests = false
default-run = "pi"

[dependencies]
pi-coding-agent-base = { version = "=0.0.0", path = "../pi-coding-agent-base" }
pi-coding-agent-core = { version = "=0.0.0", path = "../pi-coding-agent-core" }
pi-coding-agent-extensions = { version = "=0.0.0", path = "../pi-coding-agent-extensions" }
pi-coding-agent-interactive = { version = "=0.0.0", path = "../pi-coding-agent-interactive" }
# Native normalization for rehomed edit/path primitives (Node ICU semantics).
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
# Supplies typed agent-harness values and the shared truncation size formatter.
pi-agent-core = { version = "=0.0.0", path = "../pi-agent-core" }
# Supplies the shared HTTP `Fetch` contract and default client.
pi-ai = { version = "=0.0.0", path = "../pi-ai" }
# Shared JS semantics: Date.parse, localeCompare, Base64, numbers, minimatch.
pi-js-compat = { version = "=0.0.0", path = "../pi-js-compat", features = ["rusqlite"] }
# Insertion-ordered registries matching TypeScript `Map` iteration in extensions
# and the unknown CLI flags that TypeScript stores in a `Map`.
indexmap = { version = "=2.14.2", features = ["serde"] }
# Supplies the TUI keybinding registry that coding-agent extends.
pi-tui = { version = "=0.0.0", path = "../pi-tui" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip", "raw_value"] }
regex = "=1.13.1"
gethostname = "=1.1.0"
# Frozen codex-usage all-account reset labels use America/Chicago, independent of host TZ.
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# Local-time label timestamps in the session tree selector.
# `Math.random()` jitter between Supervisor request attempts.
getrandom = "=0.4.3"
serde_yaml_ng = "=0.10.0"
url = "=2.5.8"
percent-encoding = "=2.3.2"
tokio = { version = "=1.53.3", features = ["rt", "macros", "time", "sync", "process", "io-util", "io-std", "fs", "signal"] }
notify = "=8.2.0"
# Same photon-rs release and transitive `image` stack as the WASM build behind @silvia-odwyer/photon-node 0.3.4.
photon-rs = { version = "=0.3.3", default-features = false }
# Fallible decode/encode calls that photon-rs only exposes as panicking wrappers.
# Codec features mirror photon-rs so decode support matches the WASM build.
image = { version = "=0.24.9", default-features = false, features = [
    "bmp",
    "dds",
    "dxt",
    "farbfeld",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "tga",
    "tiff",
    "webp",
] }
# The clipboard-rs release vendored by @mariozechner/clipboard 0.3.9.
clipboard-rs = "=0.3.4"
# Filesystem access checks, process signals, and Node stderr descriptor classification (SO_TYPE/getsockname).
rustix = { version = "=1.1.5", features = ["fs", "net", "process"] }
# npm semver validation/range matching for package sources.
semver = "=1.0.28"
# `glob` manifest-entry expansion in `core::package_manager`.
globset = "=0.4.20"
# `.gitignore`/`.ignore`/`.fdignore` matching for package resource discovery.
# `createHash("sha256")` for temporary install directory names.
sha2 = "=0.10.9"
# Bounded-concurrency update checks and git updates.
futures-util = "=0.3.34"
# Opt-in Doom WAD downloader: Node gunzipSync parity.
flate2 = "=1.0.34"
# Frozen coding-agent archived session transcripts.
zstd = "=0.14.3"
# Shared control.sqlite access.
rusqlite = { version = "=0.37.0", features = ["bundled"] }
# `mkdtempSync`-style private directory for the external editor prompt.
tempfile = "=3.27.0"
# `execve` with an explicit environment for self-restart; std's `CommandExt::exec`
# swaps the process-global environ under a read lock and races with env readers.
nix = { version = "=0.30.1", features = ["process"] }

[[bin]]
# The `pi` CLI (`cli.ts` + `main.ts`).
name = "pi"
path = "src/bin/pi.rs"

[[bin]]
# Deterministic mode harness for the print/RPC differential tests.
name = "pi-mode-harness"
path = "tests/bin/pi_mode_harness.rs"
test = false
bench = false
doc = false

[[test]]
# Test-only real bash tool/controller lifecycle with internal-runner dispatch.
name = "bash-runner-lifecycle"
path = "tests/bin/bash_runner_lifecycle.rs"
harness = false

[[bin]]
# Process-boundary fixture for relay startup; tests supply only sandboxed SSH fakes.
name = "host-relay-harness"
path = "tests/bin/host_relay_harness.rs"
test = false
bench = false
doc = false

