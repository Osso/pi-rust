[package]
autotests = false
name = "pi-agent-core"
version = "0.0.0"
description = "Rust port of Pi's agent core runtime"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# OS entropy for the frozen agent-core UUIDv7 generator.
getrandom = "=0.4.3"
pi-ai = { version = "=0.0.0", path = "../pi-ai" }
# Shared localeCompare/Base64/JS number semantics.
pi-js-compat = { version = "=0.0.0", path = "../pi-js-compat" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.3", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
rustix = { version = "=1.1.5", features = ["process"] }
indexmap = { version = "=2.14.2", features = ["serde"] }
serde_yaml_ng = "=0.10.0"

[dev-dependencies]
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true

[[test]]
name = "suite_core"
path = "tests/suite_core.rs"

[[test]]
name = "suite_modes"
path = "tests/suite_modes.rs"

[[test]]
name = "suite_session"
path = "tests/suite_session.rs"

[[test]]
name = "suite_tools"
path = "tests/suite_tools.rs"

[[test]]
name = "differential_node_env"
path = "tests/differential_node_env.rs"

[[test]]
name = "process_env_reads"
path = "tests/process_env_reads.rs"

[[test]]
name = "proxy"
path = "tests/proxy.rs"

[[test]]
name = "repin_node_discovery"
path = "tests/repin_node_discovery.rs"

[[test]]
name = "repin_node_legacy_wsl"
path = "tests/repin_node_legacy_wsl.rs"

[[test]]
name = "session_cycle_characterization"
path = "tests/session_cycle_characterization.rs"
