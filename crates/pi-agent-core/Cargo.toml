[package]
name = "pi-agent-core"
version = "0.0.0"
description = "Rust port of Pi's agent core runtime"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pi-ai = { version = "=0.0.0", path = "../pi-ai" }
pi-telemetry = { version = "=0.0.0", path = "../pi-telemetry" }
# Shared localeCompare/Base64/JS number semantics.
pi-js-compat = { version = "=0.0.0", path = "../pi-js-compat" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.3", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
rustix = { version = "=1.1.5", features = ["process"] }
# Applies `String.prototype.normalize` forms (NFC/NFD/NFKC/NFKD) from the
# same ICU data family as Node's ICU.
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
ignore = "=0.4.23"
# Preserves TypeScript object key order for harness headers and metadata patches.
indexmap = { version = "=2.14.2", features = ["serde"] }
serde_yaml_ng = "=0.10.0"

[dev-dependencies]
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
