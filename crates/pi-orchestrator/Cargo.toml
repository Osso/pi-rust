[package]
name = "pi-orchestrator"
version = "0.0.0"
description = "Frozen Pi orchestrator package port"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autobins = false

[dependencies]
pi-coding-agent = { version = "=0.0.0", path = "../pi-coding-agent" }
pi-ai = { version = "=0.0.0", path = "../pi-ai" }
pi-js-compat = { version = "=0.0.0", path = "../pi-js-compat" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.3", features = ["net", "rt", "macros", "time", "sync", "process", "io-util", "io-std", "signal"] }
url = "=2.5.8"
gethostname = "=1.1.0"
getrandom = "=0.4.3"
indexmap = "=2.14.2"
rustix = { version = "=1.1.5", features = ["process"] }

[dev-dependencies]
tokio-util = "=0.7.20"
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["test-util"] }

[lints]
workspace = true
