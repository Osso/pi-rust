[package]
name = "pi-coding-agent-storage"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autotests = false
autoexamples = false
autobenches = false

[dependencies]
parking_lot = "=0.12.5"
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
pi-agent-core = { version = "=0.0.0", path = "../pi-agent-core" }
pi-ai = { version = "=0.0.0", path = "../pi-ai" }
pi-js-compat = { version = "=0.0.0", path = "../pi-js-compat", features = ["rusqlite"] }
indexmap = { version = "=2.14.2", features = ["serde"] }
pi-tui = { version = "=0.0.0", path = "../pi-tui" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip", "raw_value"] }
regex = "=1.13.1"
gethostname = "=1.1.0"
getrandom = "=0.4.3"
url = "=2.5.8"
tokio = { version = "=1.53.3", features = ["rt", "macros", "time", "sync", "process", "io-util", "io-std", "fs", "signal"] }
notify = "=8.2.0"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
sha2 = "=0.10.9"
futures-util = "=0.3.34"
zstd = "=0.14.3"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tempfile = "=3.27.0"
nix = { version = "=0.30.1", features = ["process"] }
pi-coding-agent-base = { version = "=0.0.0", path = "../pi-coding-agent-base" }

pi-coding-agent-data = { version = "=0.0.0", path = "../pi-coding-agent-data" }

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["net", "rt-multi-thread", "fs", "test-util"] }
nix = { version = "=0.30.1", features = ["poll", "process", "term"] }

[lints]
workspace = true
