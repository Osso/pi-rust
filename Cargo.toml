[workspace]
members = [
    "crates/pi-protocol",
    "crates/pi-telemetry",
    "crates/pi-ai",
    "crates/pi-agent-core",
    "crates/pi-tui",
    "crates/pi-coding-agent",
    "crates/pi-client",
    "crates/pi-server",
    "crates/pi-session-sqlite",
    "crates/pi-js-compat",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"
