[workspace]
members = [
    "crates/pi-telemetry",
    "crates/pi-ai",
    "crates/pi-agent-core",
    "crates/pi-tui",
    "crates/pi-coding-agent",
    "crates/pi-coding-agent-base",
    "crates/pi-coding-agent-data",
    "crates/pi-coding-agent-storage",
    "crates/pi-coding-agent-packages",
    "crates/pi-coding-agent-tools",
    "crates/pi-coding-agent-core",
    "crates/pi-coding-agent-extensions",
    "crates/pi-coding-agent-interactive",
    "crates/pi-js-compat",
    "crates/pi-orchestrator",
]
exclude = ["crates/pi-js-compat/vendor/regress"]
# `cargo run` at the workspace root builds the `pi` executable.
default-members = ["crates/pi-coding-agent"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.96"

# Disk budget: ~460 integration-test binaries each link every dependency.
# Full debuginfo plus incremental state grew target/ to ~680 GB.
# Incremental is disabled in .cargo/config.toml (overrides ~/.cargo).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
# Native ECMAScript legacy canonicalization; see vendor/regress/UPSTREAM.json.
regress = { path = "crates/pi-js-compat/vendor/regress" }
