[workspace]
members = [
    "crates/pi-protocol",
    "crates/pi-telemetry",
    "crates/pi-ai",
    "crates/pi-agent-core",
    "crates/pi-tui",
    "crates/pi-coding-agent",
    "crates/pi-client",
    "crates/pi-server",
    "crates/pi-session-sqlite",
    "crates/pi-js-compat",
    "crates/pi-evals",
]
# `cargo run` at the workspace root builds the `pi` executable.
default-members = ["crates/pi-coding-agent"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.96"

# Disk budget: ~460 integration-test binaries each link every dependency.
# Full debuginfo plus incremental state grew target/ to ~680 GB.
# Incremental is disabled in .cargo/config.toml (overrides ~/.cargo).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
[workspace.lints.rust]
unsafe_code = "forbid"
